name: Conda packaging and deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next, qa, main]
    tags: ["v*"]

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG_NAME: mantid-total-scattering
  MODULE_NAME: total_scattering

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: pyproject.toml

      - name: lint
        run: pixi run lint

      - name: Run unit tests
        run: |
          sudo apt-get install libglu1-mesa
          pixi run test

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v5
        if: github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  docker-build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and generate tags
        id: meta
        run: |
          # Get the image name
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mantid-total-scattering"
          
          # Initialize tags with SHA
          TAGS="${IMAGE_NAME}:${{ github.sha }}"
          
          # If this is a tag push, extract version tags
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., v1.2.9 or v1.2.9rc1)
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
            
            # Extract major.minor.patch (e.g., 1.2.9 from 1.2.9rc1)
            if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              
              # Add version tags: v1.2.9, v1.2, v1
              TAGS="${TAGS},${IMAGE_NAME}:v${MAJOR}.${MINOR}.${PATCH}"
              TAGS="${TAGS},${IMAGE_NAME}:v${MAJOR}.${MINOR}"
              TAGS="${TAGS},${IMAGE_NAME}:v${MAJOR}"
            fi
          fi
          
          # Always add branch-specific tags
          if [[ "${{ github.ref }}" == "refs/heads/next" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:nightly"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:qa"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  conda-build:
    name: Build conda package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.0
          manifest-path: pyproject.toml
          # Workaround: Dynamic versioning (versioningit) causes lock file version mismatch.
          # We skip the editable package install and do it separately with pip.
          # See: https://github.com/prefix-dev/pixi/pull/3092
          run-install: false

      - name: Install dependencies (skip local package)
        run: pixi install --frozen --skip ${{ env.PKG_NAME }}

      - name: Install local package
        run: pixi run pip install --no-deps -e .

      - name: Build conda package
        run: |
          pixi run build-conda
          mkdir -p /tmp/local-channel/linux-64
          mkdir -p /tmp/local-channel/noarch
          cp *.conda /tmp/local-channel/linux-64
          echo '{"info": {}, "packages": {}, "packages.conda": {}, "repodata_version": 1}' > /tmp/local-channel/noarch/repodata.json

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2

      - name: Create test environment
        run: |
          micromamba create -n pkg-test python=3.11 -c /tmp/local-channel -c conda-forge -c mantid -c neutrons ${{ env.PKG_NAME }} -y
        shell: bash -el {0}

      - name: Verify conda package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: neutrons/conda-actions/pkg-verify@main
        with:
          package-name: ${{ env.PKG_NAME }}
          module-name: ${{ env.MODULE_NAME }}
          local-channel: /tmp/local-channel
          python-version: 3.11
          extra-channels: conda-forge mantid neutrons
          conda-env-name: pkg-test

      - name: Upload conda package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  publish:
    name: Upload package to anaconda
    runs-on: ubuntu-latest
    needs: [test, conda-build]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.0
          manifest-path: pyproject.toml
          # Workaround: Dynamic versioning (versioningit) causes lock file version mismatch.
          # We skip the editable package install and do it separately with pip.
          # See: https://github.com/prefix-dev/pixi/pull/3092
          run-install: false

      - name: Install dependencies (skip local package)
        run: pixi install --frozen --skip ${{ env.PKG_NAME }}

      - name: Download conda package artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-conda-package

      - name: Upload package to anaconda
        uses: neutrons/conda-actions/publish@main
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package-path: ${{ env.PKG_NAME }}-*.conda

      - name: Remove old packages
        if: github.ref == 'refs/heads/next'
        uses: neutrons/conda-actions/pkg-remove@v1
        with:
          anaconda_token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package_name: ${{ env.PKG_NAME }}
          label: ${{ env.CONDA_LABEL }}
          keep: 5

  deploy-dev:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/next'
    steps:
      - name: Get Environment Name
        uses: neutrons/branch-mapper@main
        id: env_name
        with:
          prefix: ${{ env.PKG_NAME }}

      - name: Trigger Dev Deploy
        # use https://github.com/eic/trigger-gitlab-ci/pull/14 until merged
        uses: eic/trigger-gitlab-ci@d984d8d53d871d2fdc1325639d94322da6e8747f
        id: trigger
        with:
          url: https://code.ornl.gov
          project_id: 18031
          ref_name: main
          token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Annotate commit
        uses: peter-evans/commit-comment@v4
        with:
          body: |
            GitLab pipeline for ${{ steps.env_name.outputs.name }} has been submitted for this commit: ${{ steps.trigger.outputs.web_url }}

  conda-build-wrapper:
    name: Build wrapper conda package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.0
          manifest-path: pyproject.toml
          # Workaround: Dynamic versioning (versioningit) causes lock file version mismatch.
          # We skip the editable package install and do it separately with pip.
          # See: https://github.com/prefix-dev/pixi/pull/3092
          run-install: false

      - name: setup wrapper toml
        run: pixi run 

      - name: Install dependencies (skip local package)
        run: pixi install --frozen --skip ${{ env.PKG_NAME }}

      - name: Install local package
        run: pixi run pip install --no-deps -e .

      - name: Build conda package
        run: |
          pixi run build-conda-wrapper
          mkdir -p /tmp/local-channel/linux-64
          mkdir -p /tmp/local-channel/noarch
          cp *.conda /tmp/local-channel/linux-64
          echo '{"info": {}, "packages": {}, "packages.conda": {}, "repodata_version": 1}' > /tmp/local-channel/noarch/repodata.json

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2

      - name: Create test environment
        run: |
          micromamba create -n pkg-test python=3.11 -c /tmp/local-channel -c conda-forge -c mantid -c neutrons ${{ env.PKG_NAME }} -y
        shell: bash -el {0}

      - name: Verify conda package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: neutrons/conda-actions/pkg-verify@main
        with:
          package-name: ${{ env.PKG_NAME }}-python-wrapper
          module-name: ${{ env.MODULE_NAME }}
          local-channel: /tmp/local-channel
          python-version: 3.11
          extra-channels: conda-forge
          conda-env-name: pkg-test-wrapper

      - name: Upload conda package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-wrapper-conda-package
          path: ${{ env.PKG_NAME }}-python-wrapper-*.conda

  publish-wrapper:
      name: Upload wrapper package to anaconda
      runs-on: ubuntu-latest
      needs: [test, conda-build-wrapper]
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next'
      steps:
        - name: Checkout
          uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true

        - name: Setup Pixi
          uses: prefix-dev/setup-pixi@v0.9.4
          with:
            pixi-version: v0.72.0
            manifest-path: pyproject.toml
            # Workaround: Dynamic versioning (versioningit) causes lock file version mismatch.
            # We skip the editable package install and do it separately with pip.
            # See: https://github.com/prefix-dev/pixi/pull/3092
            run-install: false

        - name: Install dependencies (skip local package)
          run: pixi install --frozen --skip ${{ env.PKG_NAME }}

        - name: Download conda package artifact
          uses: actions/download-artifact@v8
          with:
            name: artifact-wrapper-conda-package

        - name: Upload package to anaconda
          uses: neutrons/conda-actions/publish@main
          with:
            anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
            organization: neutrons
            package-path: ${{ env.PKG_NAME }}-python-wrapper-*.conda

        - name: Remove old packages
          if: github.ref == 'refs/heads/next'
          uses: neutrons/conda-actions/pkg-remove@v1
          with:
            anaconda_token: ${{ secrets.ANACONDA_TOKEN }}
            organization: neutrons
            package_name: ${{ env.PKG_NAME }}-python-wrapper
            label: ${{ env.CONDA_LABEL }}
            keep: 5
